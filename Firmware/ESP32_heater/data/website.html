<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Probe</title>
<style>
  :root{
    --bg:#000000;
    --panel:#0a0d0d;
    --panel-border:#1c2424;
    --grid-line:#111818;
    --text:#e7efef;
    --text-dim:#7d9191;
    --text-faint:#465555;
    --accent:#3fd6ff;      /* cryo blue - measure */
    --accent-dim:#1c5a6b;
    --heat:#ff8a3d;         /* warm accent - heat */
    --heat-dim:#7a3c17;
    --bad:#ff4d4d;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", "Consolas", monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  body{
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-attachment: fixed;
  }

  .app{ display:flex; flex-direction:column; min-height:100vh; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--panel-border);
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
    position:sticky; top:0; z-index:10;
  }
  .tabs{ display:flex; gap:6px; }
  .tab{
    appearance:none; border:1px solid var(--panel-border); background:transparent;
    color:var(--text-dim); font-family:var(--mono); font-size:13px; letter-spacing:2px;
    padding:9px 18px; cursor:pointer; border-radius:3px; transition:all .15s ease;
  }
  .tab:hover{ color:var(--text); border-color:var(--text-faint); }
  .tab[data-tab="measure"].active{
    color:#00121a; background:var(--accent); border-color:var(--accent);
    box-shadow:0 0 14px -2px var(--accent);
  }
  .tab[data-tab="heat"].active{
    color:#1a0e00; background:var(--heat); border-color:var(--heat);
    box-shadow:0 0 14px -2px var(--heat);
  }

  .status{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:12px; letter-spacing:2px; color:var(--text-dim);
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-faint);
    box-shadow:0 0 0 rgba(0,0,0,0);
  }
  .status.live .dot{ background:var(--accent); box-shadow:0 0 8px 1px var(--accent); animation:pulse 1.6s ease-in-out infinite; }
  .status.offline .dot{ background:var(--bad); box-shadow:0 0 8px 1px var(--bad); }
  .status.live #statusText{ color:var(--accent); }
  .status.offline #statusText{ color:var(--bad); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- Pages ---------- */
  .page{ display:none; flex:1; padding:20px; }
  .page.active{ display:grid; }

  #measurePage{
    grid-template-columns: minmax(300px, 1fr) minmax(420px, 1.7fr);
    gap:20px;
    align-items:start;
  }
  @media (max-width: 880px){
    #measurePage{ grid-template-columns: 1fr; }
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:6px;
    padding:16px 18px 18px;
  }
  .panel h2{
    margin:0 0 14px; font-family:var(--mono); font-size:12px; letter-spacing:3px;
    color:var(--text-faint); font-weight:600;
    border-bottom:1px solid var(--panel-border); padding-bottom:10px;
  }

  /* ---------- Profile panel (left) ---------- */
  .profile-io{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  select, button, .filebtn{
    font-family:var(--mono); font-size:11px; letter-spacing:1px;
    background:#0e1414; color:var(--text-dim);
    border:1px solid var(--panel-border); border-radius:3px;
    padding:8px 10px; cursor:pointer; transition:all .15s ease;
  }
  select{ min-width:120px; }
  button:hover, .filebtn:hover{ color:var(--text); border-color:var(--accent-dim); }
  button:active{ transform:translateY(1px); }
  button#btnSaveProfile{ color:var(--accent); border-color:var(--accent-dim); }
  button#btnDeleteProfile{ color:var(--bad); border-color:#5a1c1c; }
  .profile-select-row{ display:flex; gap:8px; margin-bottom:8px; width:100%; }
  .profile-select-row select{ flex:1; }
  .profile-btn-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .fit-status{
    font-family:var(--mono); font-size:11px; letter-spacing:1px;
    color:var(--text-faint); margin-left:auto;
  }
  .fit-status.ok{ color:var(--accent); }
  .fit-status.bad{ color:var(--bad); }

  textarea#profileText{
    width:100%; min-height:96px; resize:vertical;
    background:#050707; color:var(--text);
    border:1px solid var(--panel-border); border-radius:4px;
    font-family:var(--mono); font-size:12px; padding:10px; line-height:1.5;
    margin-bottom:14px;
  }
  textarea#profileText::placeholder{ color:var(--text-faint); }

  canvas#profileChart{ width:100%; height:260px; display:block; }

  /* ---------- Debug section (below profile) ---------- */
  .debug-section{
    margin-top:16px; padding-top:14px;
    border-top:1px solid var(--panel-border);
  }
  .debug-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
  }
  .debug-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:10px 16px;
  }
  .debug-item{
    display:flex; flex-direction:column; gap:3px;
  }
  .debug-item label{
    font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--text-faint);
  }
  .debug-item span{
    font-family:var(--mono); font-size:15px; color:var(--text);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Readout panel (right) ---------- */
  .readout-header{
    display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between;
    gap:16px; margin-bottom:10px;
  }
  .big-reading{
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    font-size:clamp(48px, 7vw, 76px); font-weight:600; color:var(--accent);
    line-height:1; text-shadow:0 0 22px -4px var(--accent);
  }
  .big-reading .unit{
    font-size:0.35em; color:var(--text-dim); margin-left:6px; font-weight:400;
  }
  .sub-readings{
    display:flex; gap:22px; flex-wrap:wrap; align-items:center;
    font-family:var(--mono);
  }
  .sub-readings > div{ display:flex; flex-direction:column; gap:3px; }
  .sub-readings label{
    font-size:10px; letter-spacing:2px; color:var(--text-faint);
  }
  .sub-readings span{ font-size:18px; color:var(--text); font-variant-numeric:tabular-nums; }

  canvas#tempChart{ width:100%; height:360px; display:block; margin-top:8px; }

  /* ---------- Heat page ---------- */
  #heatPage{
    grid-template-columns: minmax(300px, 1fr) minmax(340px, 1fr);
    gap:20px;
    align-items:start;
  }
  @media (max-width: 880px){
    #heatPage{ grid-template-columns: 1fr; }
  }

  canvas#heatTempChart{ width:100%; height:260px; display:block; margin-top:8px; }

  .heater-readout{
    display:flex; align-items:baseline; gap:10px; margin-bottom:4px;
  }
  .heater-readout .big-reading{ font-size:clamp(40px, 6vw, 60px); }

  .heater-controls-row{
    display:flex; align-items:center; gap:14px; margin-top:16px;
    padding-top:14px; border-top:1px solid var(--panel-border);
  }
  button#btnStartStop{
    font-size:12px; letter-spacing:2px; padding:10px 22px;
    color:var(--heat); border-color:var(--heat-dim);
  }
  button#btnStartStop.running{
    color:#1a0e00; background:var(--heat); border-color:var(--heat); box-shadow:0 0 14px -2px var(--heat);
  }
  .running-indicator{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:12px; letter-spacing:2px; color:var(--text-dim);
  }
  .running-indicator .dot{ background:var(--text-faint); }
  .running-indicator.on .dot{ background:var(--heat); box-shadow:0 0 8px 1px var(--heat); animation:pulse 1.6s ease-in-out infinite; }
  .running-indicator.on span:last-child{ color:var(--heat); }

  .control-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .control-row input[type="number"]{
    font-family:var(--mono); font-size:13px; letter-spacing:1px;
    background:#050707; color:var(--text);
    border:1px solid var(--panel-border); border-radius:4px;
    padding:9px 10px; width:120px;
  }
  .control-row input[type="number"]:focus{ outline:none; border-color:var(--accent-dim); }
  button#btnSendTarget, button#btnSendPid, button#btnSendManual{
    color:var(--heat); border-color:var(--heat-dim);
  }

  .pid-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
    margin-bottom:12px;
  }
  .pid-grid label{
    display:flex; flex-direction:column; gap:5px;
    font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--text-faint);
  }
  .pid-grid input[type="number"]{
    font-family:var(--mono); font-size:13px;
    background:#050707; color:var(--text);
    border:1px solid var(--panel-border); border-radius:4px;
    padding:9px 10px; width:100%;
  }
  .pid-grid input[type="number"]:focus{ outline:none; border-color:var(--accent-dim); }

  .checkbox-row{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:11px; letter-spacing:1px; color:var(--text-dim);
    cursor:pointer;
  }
  .checkbox-row input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--heat); }

  button:disabled, input:disabled{ opacity:0.35; cursor:not-allowed; }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <nav class="tabs">
      <button class="tab active" data-tab="measure">MEASURE</button>
      <button class="tab" data-tab="heat">HEAT</button>
    </nav>
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">CONNECTING</span>
    </div>
  </header>

  <!-- ===================== MEASURE ===================== -->
  <main id="measurePage" class="page active">

    <!-- LEFT: profile -->
    <section class="panel">
      <h2>PROFILE — TEMPERATURE vs RESISTANCE (GR-300-AA)</h2>

      <div class="profile-select-row">
        <select id="profileSelect"><option value="">— saved profiles —</option></select>
      </div>
      <div class="profile-btn-row">
        <button id="btnLoadProfile" type="button">LOAD</button>
        <button id="btnDeleteProfile" type="button">DELETE</button>
        <button id="btnSaveProfile" type="button">SAVE TO DEVICE</button>
        <span class="fit-status" id="fitStatus"></span>
      </div>

      <textarea id="profileText" placeholder="temperature_K, resistance_ohm&#10;e.g. from a GR-300-AA data sheet table&#10;0.3, 35180&#10;1.0, 875.7&#10;4.2, 94.46&#10;10, 33.20&#10;77.4, 3.504"></textarea>

      <canvas id="profileChart"></canvas>

      <div class="debug-section">
        <div class="debug-header">
          <h2 style="margin-bottom:0; border-bottom:none; padding-bottom:0;">DEBUG</h2>
          <button id="btnToggleDebug" type="button">HIDE</button>
        </div>
        <div class="debug-grid" id="debugGrid">
          <div class="debug-item"><label>CURRENT SOURCE</label><span id="dbgCurSource">--</span></div>
          <div class="debug-item"><label>CURRENT DIRECTION</label><span id="dbgCurDirection">--</span></div>
          <div class="debug-item"><label>SHUNT RESISTOR</label><span id="dbgShuntResistor">--</span></div>
          <div class="debug-item"><label>FIT VALID</label><span id="dbgFitValid">--</span></div>
          <div class="debug-item"><label>ACTIVE PROFILE</label><span id="dbgActiveProfile">--</span></div>
        </div>
      </div>
    </section>

    <!-- RIGHT: live readout + graph -->
    <section class="panel">
      <div class="readout-header">
        <div class="big-reading"><span id="tempValue">--</span><span class="unit">K</span></div>
        <div class="sub-readings">
          <div><label>RESISTANCE</label><span id="resValue">-- &#8486;</span></div>
          <div><label>VOLTAGE</label><span id="voltValue">-- mV</span></div>
          <div><label>CURRENT</label><span id="curValue">-- uA</span></div>
        </div>
      </div>
      <canvas id="tempChart"></canvas>
    </section>

  </main>

  <!-- ===================== HEAT ===================== -->
  <main id="heatPage" class="page">

    <!-- LEFT: temperature + heater output -->
    <section class="panel">
      <h2>TEMPERATURE</h2>
      <div class="heater-readout">
        <div class="big-reading"><span id="heatTempValue">--</span><span class="unit">K</span></div>
      </div>
      <canvas id="heatTempChart"></canvas>

      <div class="debug-section">
        <div class="debug-header">
          <h2 style="margin-bottom:0; border-bottom:none; padding-bottom:0;">HEATER OUTPUT</h2>
        </div>
        <div class="debug-grid">
          <div class="debug-item"><label>VOLTAGE DROP</label><span id="heaterVoltage">-- V</span></div>
          <div class="debug-item"><label>CURRENT</label><span id="heaterCurrent">-- A</span></div>
          <div class="debug-item"><label>POWER</label><span id="heaterPower">-- W</span></div>
          <div class="debug-item"><label>% MAX POWER</label><span id="heaterPowerPct">-- %</span></div>
        </div>
      </div>

      <div class="heater-controls-row">
        <button id="btnStartStop" type="button">START</button>
        <div class="running-indicator" id="runningIndicator">
          <span class="dot"></span><span id="runningText">STOPPED</span>
        </div>
      </div>
    </section>

    <!-- RIGHT: setpoint / PID / manual override -->
    <section class="panel">
      <h2>TARGET TEMPERATURE</h2>
      <div class="control-row">
        <input type="number" id="targetTempInput" placeholder="K" step="0.1">
        <button id="btnSendTarget" type="button">SEND</button>
      </div>

      <h2 style="margin-top:20px;">PID GAINS</h2>
      <div class="pid-grid">
        <label>Kp <input type="number" id="pidKp" step="0.001"></label>
        <label>Ki <input type="number" id="pidKi" step="0.001"></label>
        <label>Kd <input type="number" id="pidKd" step="0.001"></label>
      </div>
      <div class="control-row">
        <button id="btnSendPid" type="button">SEND &amp; SAVE</button>
      </div>

      <h2 style="margin-top:20px;">MANUAL OVERRIDE</h2>
      <div class="control-row">
        <label class="checkbox-row"><input type="checkbox" id="manualEnable">ENABLE</label>
        <input type="number" id="manualCurrentInput" min="0" max="0.5" step="0.01" placeholder="0 – 0.5 A">
        <button id="btnSendManual" type="button">SEND</button>
      </div>
    </section>

  </main>

</div>

<script>
(function(){
  "use strict";

  /* ---------------- Tabs ---------------- */
  var tabs = document.querySelectorAll(".tab");
  var pages = { measure: document.getElementById("measurePage"), heat: document.getElementById("heatPage") };
  tabs.forEach(function(tab){
    tab.addEventListener("click", function(){
      tabs.forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      Object.keys(pages).forEach(function(k){ pages[k].classList.remove("active"); });
      pages[tab.dataset.tab].classList.add("active");
    });
  });

  /* ---------------- Status ---------------- */
  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var lastGoodDataTime = 0;
  // Polling was fast enough (500ms poll / 1.5s stale) that brief hiccups —
  // a slow SPI transaction, a retried TCP segment on the softAP — flipped
  // the badge to OFFLINE and back on their own, reading as "cutting out".
  // Slower polling and a more tolerant staleness window fix that without
  // hiding an actually-dead connection for long.
  var POLL_MS = 1000;
  var STALE_MS = POLL_MS * 5;

  function setStatus(live){
    statusEl.classList.toggle("live", live);
    statusEl.classList.toggle("offline", !live);
    statusText.textContent = live ? "LIVE" : "OFFLINE";
  }
  setInterval(function(){
    if (Date.now() - lastGoodDataTime > STALE_MS) setStatus(false);
  }, POLL_MS);

  /* ---------------- Live data polling ---------------- */
  var tempValue = document.getElementById("tempValue");
  var resValue  = document.getElementById("resValue");
  var voltValue = document.getElementById("voltValue");
  var curValue  = document.getElementById("curValue");

  var WINDOW_MS = 5 * 60 * 1000; // fixed 5 minute rolling window
  var history = []; // { t: ms, temp, res, volt, cur }

  // Debug panel: shows every debug field at once, and can be hidden.
  var dbgCurSource = document.getElementById("dbgCurSource");
  var dbgCurDirection = document.getElementById("dbgCurDirection");
  var dbgShuntResistor = document.getElementById("dbgShuntResistor");
  var dbgFitValid = document.getElementById("dbgFitValid");
  var dbgActiveProfile = document.getElementById("dbgActiveProfile");

  function renderDebugValues(d){
    dbgCurSource.textContent = (typeof d.curSource === "number") ? d.curSource : "--";
    dbgCurDirection.textContent = (typeof d.curDirection === "number") ? d.curDirection : "--";
    dbgShuntResistor.textContent = (typeof d.shuntResistor === "number") ? d.shuntResistor : "--";
    dbgFitValid.textContent = (typeof d.fitValid === "boolean") ? (d.fitValid ? "YES" : "NO") : "--";
    dbgActiveProfile.textContent = (typeof d.activeProfile === "string" && d.activeProfile.length)
      ? d.activeProfile : "(none)";
  }

  var debugGrid = document.getElementById("debugGrid");
  var btnToggleDebug = document.getElementById("btnToggleDebug");
  var debugVisible = true;
  btnToggleDebug.addEventListener("click", function(){
    debugVisible = !debugVisible;
    debugGrid.style.display = debugVisible ? "" : "none";
    btnToggleDebug.textContent = debugVisible ? "HIDE" : "SHOW";
  });

  function fmt(n, digits){
    if (n === null || n === undefined || isNaN(n)) return "--";
    return Number(n).toFixed(digits);
  }

  /* ---------------- Heat page: readouts + controls ---------------- */
  var heatTempValue = document.getElementById("heatTempValue");
  var heaterVoltageEl = document.getElementById("heaterVoltage");
  var heaterCurrentEl = document.getElementById("heaterCurrent");
  var heaterPowerEl = document.getElementById("heaterPower");
  var heaterPowerPctEl = document.getElementById("heaterPowerPct");

  var btnStartStop = document.getElementById("btnStartStop");
  var runningIndicator = document.getElementById("runningIndicator");
  var runningText = document.getElementById("runningText");

  var targetTempInput = document.getElementById("targetTempInput");
  var btnSendTarget = document.getElementById("btnSendTarget");

  var pidKpInput = document.getElementById("pidKp");
  var pidKiInput = document.getElementById("pidKi");
  var pidKdInput = document.getElementById("pidKd");
  var btnSendPid = document.getElementById("btnSendPid");

  var manualEnable = document.getElementById("manualEnable");
  var manualCurrentInput = document.getElementById("manualCurrentInput");
  var btnSendManual = document.getElementById("btnSendManual");

  var heaterRunning = false; // last known state from the device

  function isFocused(el){ return document.activeElement === el; }

  function renderHeaterValues(d){
    heatTempValue.textContent = fmt(typeof d.temperature === "number" ? d.temperature : NaN, 2);

    var hv = typeof d.heaterVoltage === "number" ? d.heaterVoltage : NaN;
    var hc = typeof d.heaterCurrent === "number" ? d.heaterCurrent : NaN;
    var maxPower = typeof d.heaterMaxPowerW === "number" ? d.heaterMaxPowerW : NaN;
    var power = hv * hc;

    heaterVoltageEl.textContent = fmt(hv, 3) + " V";
    heaterCurrentEl.textContent = fmt(hc, 3) + " A";
    heaterPowerEl.textContent = fmt(power, 2) + " W";
    heaterPowerPctEl.textContent = (isFinite(power) && maxPower > 0)
      ? fmt(power / maxPower * 100, 1) + " %" : "--";

    heaterRunning = !!d.heaterRunning;
    btnStartStop.textContent = heaterRunning ? "STOP" : "START";
    btnStartStop.classList.toggle("running", heaterRunning);
    runningIndicator.classList.toggle("on", heaterRunning);
    runningText.textContent = heaterRunning ? "RUNNING" : "STOPPED";

    // Manual override only makes sense while the PID loop is stopped.
    manualEnable.disabled = heaterRunning;
    manualCurrentInput.disabled = heaterRunning;
    btnSendManual.disabled = heaterRunning;
    if (!isFocused(manualEnable)) manualEnable.checked = !!d.manualOverride;
    if (!isFocused(manualCurrentInput) && typeof d.manualCurrent === "number") {
      manualCurrentInput.value = d.manualCurrent;
    }

    if (!isFocused(targetTempInput) && typeof d.targetTemperature === "number") {
      targetTempInput.value = d.targetTemperature;
    }
    if (!isFocused(pidKpInput) && typeof d.pidKp === "number") pidKpInput.value = d.pidKp;
    if (!isFocused(pidKiInput) && typeof d.pidKi === "number") pidKiInput.value = d.pidKi;
    if (!isFocused(pidKdInput) && typeof d.pidKd === "number") pidKdInput.value = d.pidKd;
  }

  btnStartStop.addEventListener("click", function(){
    fetch(heaterRunning ? "/heater/stop" : "/heater/start", { method: "POST" })
      .catch(function(){ alert("Could not reach device."); });
  });

  btnSendTarget.addEventListener("click", function(){
    var v = parseFloat(targetTempInput.value);
    if (!isFinite(v)) { alert("Enter a target temperature."); return; }
    fetch("/heater/target?value=" + encodeURIComponent(v), { method: "POST" })
      .catch(function(){ alert("Could not reach device."); });
  });

  btnSendPid.addEventListener("click", function(){
    var kp = parseFloat(pidKpInput.value);
    var ki = parseFloat(pidKiInput.value);
    var kd = parseFloat(pidKdInput.value);
    if (!isFinite(kp) || !isFinite(ki) || !isFinite(kd)) { alert("Enter valid Kp/Ki/Kd values."); return; }
    fetch("/heater/pid?kp=" + encodeURIComponent(kp) + "&ki=" + encodeURIComponent(ki) + "&kd=" + encodeURIComponent(kd),
      { method: "POST" })
      .catch(function(){ alert("Could not reach device."); });
  });

  btnSendManual.addEventListener("click", function(){
    var enabled = manualEnable.checked;
    var cur = parseFloat(manualCurrentInput.value);
    if (!isFinite(cur)) cur = 0;
    fetch("/heater/manual?enabled=" + (enabled ? "1" : "0") + "&current=" + encodeURIComponent(cur), { method: "POST" })
      .then(function(r){ if (r.status === 409) alert("Stop the PID loop before using manual override."); })
      .catch(function(){ alert("Could not reach device."); });
  });

  function pollData(){
    fetch("/data", { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw new Error("bad status"); return r.json(); })
      .then(function(d){
        lastGoodDataTime = Date.now();
        setStatus(true);

        var point = {
          t: Date.now(),
          temp: typeof d.temperature === "number" ? d.temperature : NaN,
          res:  typeof d.resistance  === "number" ? d.resistance  : NaN,
          volt: typeof d.voltage     === "number" ? d.voltage     : NaN,
          cur:  typeof d.current     === "number" ? d.current     : NaN
        };

        tempValue.textContent = fmt(point.temp, 2);
        resValue.textContent  = fmt(point.res, 1) + " \u2126";
        voltValue.textContent = fmt(point.volt, 3) + " mV";
        curValue.textContent  = fmt(point.cur, 3) + " uA";

        renderDebugValues(d);
        renderHeaterValues(d);

        history.push(point);
        var cutoff = Date.now() - WINDOW_MS - 1000;
        while (history.length && history[0].t < cutoff) history.shift();

        drawTempChart();
      })
      .catch(function(){
        // leave last known readout values on screen; status handled by staleness timer
      });
  }
  setInterval(pollData, POLL_MS);
  pollData();

  /* ---------------- Canvas helpers ---------------- */
  function setupCanvas(canvas){
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(rect.width, 1);
    var h = Math.max(rect.height, 1) || canvas.clientHeight || 260;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  function niceScale(min, max, pad, minRange){
    if (!isFinite(min) || !isFinite(max)){ return { min:0, max: (minRange || 1) }; }
    if (min === max){ min -= 1; max += 1; }
    var range = max - min;
    var scale = { min: min - range*pad, max: max + range*pad };
    if (minRange){
      var span = scale.max - scale.min;
      if (span < minRange){
        var center = (scale.max + scale.min) / 2;
        scale.min = center - minRange / 2;
        scale.max = center + minRange / 2;
      }
    }
    return scale;
  }

  function drawAxes(ctx, w, h, margin, xLabel, yLabel){
    ctx.strokeStyle = "#1c2424";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(margin.l, margin.t);
    ctx.lineTo(margin.l, h - margin.b);
    ctx.lineTo(w - margin.r, h - margin.b);
    ctx.stroke();

    ctx.fillStyle = "#465555";
    ctx.font = "10px ui-monospace, monospace";
    ctx.textAlign = "center";
    if (xLabel) ctx.fillText(xLabel, (margin.l + (w - margin.r)) / 2, h - 4);
    ctx.save();
    if (yLabel){
      ctx.translate(10, (margin.t + (h - margin.b)) / 2);
      ctx.rotate(-Math.PI/2);
      ctx.fillText(yLabel, 0, 0);
    }
    ctx.restore();
  }

  function gridLines(ctx, w, h, margin, yMin, yMax, yTicks){
    ctx.strokeStyle = "#111818";
    ctx.fillStyle = "#465555";
    ctx.font = "10px ui-monospace, monospace";
    ctx.textAlign = "right";
    for (var i = 0; i <= yTicks; i++){
      var frac = i / yTicks;
      var y = (h - margin.b) - frac * (h - margin.b - margin.t);
      var val = yMin + frac * (yMax - yMin);
      ctx.beginPath();
      ctx.moveTo(margin.l, y);
      ctx.lineTo(w - margin.r, y);
      ctx.stroke();
      ctx.fillText(val.toFixed(1), margin.l - 6, y + 3);
    }
  }

  /* ---------------- Temperature vs time chart ---------------- */
  // Same 5-minute temperature history feeds both the measure page's chart
  // and the heat page's chart, so they're always drawn from a single
  // function called with each canvas in turn.
  var tempCanvas = document.getElementById("tempChart");
  var heatTempCanvas = document.getElementById("heatTempChart");
  var TEMP_CHART_MIN_RANGE_K = 5; // y-range must always span at least this many K

  function drawTempChartOn(canvas){
    var setup = setupCanvas(canvas);
    var ctx = setup.ctx, w = setup.w, h = setup.h;
    ctx.clearRect(0, 0, w, h);

    var margin = { l: 46, r: 14, t: 12, b: 22 };
    var now = Date.now();
    var pts = history.filter(function(p){ return isFinite(p.temp); });

    var temps = pts.map(function(p){ return p.temp; });
    var yMin = temps.length ? Math.min.apply(null, temps) : 0;
    var yMax = temps.length ? Math.max.apply(null, temps) : 1;
    var scale = niceScale(yMin, yMax, 0.15, TEMP_CHART_MIN_RANGE_K);

    gridLines(ctx, w, h, margin, scale.min, scale.max, 4);
    drawAxes(ctx, w, h, margin, "TIME (5 MIN WINDOW)", "K");

    if (pts.length > 1){
      ctx.strokeStyle = "#3fd6ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach(function(p, i){
        var xFrac = 1 - (now - p.t) / WINDOW_MS;
        var x = margin.l + xFrac * (w - margin.l - margin.r);
        var yFrac = (p.temp - scale.min) / (scale.max - scale.min);
        var y = (h - margin.b) - yFrac * (h - margin.b - margin.t);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
  }

  function drawTempChart(){
    drawTempChartOn(tempCanvas);
    drawTempChartOn(heatTempCanvas);
  }

  /* ---------------- Profile (temp vs resistance) ---------------- */
  var profileText = document.getElementById("profileText");
  var profileCanvas = document.getElementById("profileChart");
  var profileSelect = document.getElementById("profileSelect");
  var fitStatus = document.getElementById("fitStatus");

  function parseProfile(text){
    var pts = [];
    text.split("\n").forEach(function(line){
      line = line.trim();
      if (!line || line.indexOf("#") === 0) return;
      var parts = line.split(/[,\s\t]+/).filter(Boolean);
      if (parts.length < 2) return;
      var t = parseFloat(parts[0]);
      var r = parseFloat(parts[1]);
      if (isFinite(t) && isFinite(r)) pts.push({ t: t, r: r });
    });
    pts.sort(function(a,b){ return a.t - b.t; });
    return pts;
  }

  function drawProfileChart(){
    var setup = setupCanvas(profileCanvas);
    var ctx = setup.ctx, w = setup.w, h = setup.h;
    ctx.clearRect(0, 0, w, h);

    var margin = { l: 52, r: 14, t: 12, b: 26 };
    var pts = parseProfile(profileText.value);

    var rs = pts.map(function(p){ return p.r; });
    var ts = pts.map(function(p){ return p.t; });
    var yScale = niceScale(rs.length ? Math.min.apply(null, rs) : 0, rs.length ? Math.max.apply(null, rs) : 1, 0.15);
    var xScale = niceScale(ts.length ? Math.min.apply(null, ts) : 0, ts.length ? Math.max.apply(null, ts) : 1, 0.1);

    gridLines(ctx, w, h, margin, yScale.min, yScale.max, 4);
    drawAxes(ctx, w, h, margin, "TEMPERATURE (K)", "RESISTANCE (\u2126)");

    if (pts.length){
      ctx.strokeStyle = "#3fd6ff";
      ctx.fillStyle = "#3fd6ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach(function(p, i){
        var xFrac = (p.t - xScale.min) / (xScale.max - xScale.min);
        var x = margin.l + xFrac * (w - margin.l - margin.r);
        var yFrac = (p.r - yScale.min) / (yScale.max - yScale.min);
        var y = (h - margin.b) - yFrac * (h - margin.b - margin.t);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
      pts.forEach(function(p){
        var xFrac = (p.t - xScale.min) / (xScale.max - xScale.min);
        var x = margin.l + xFrac * (w - margin.l - margin.r);
        var yFrac = (p.r - yScale.min) / (yScale.max - yScale.min);
        var y = (h - margin.b) - yFrac * (h - margin.b - margin.t);
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI*2);
        ctx.fill();
      });
    }
  }
  profileText.addEventListener("input", drawProfileChart);
  window.addEventListener("resize", function(){ drawProfileChart(); drawTempChart(); });

  /* ---------------- Profile IO (device) ---------------- */
  function refreshProfileList(){
    fetch("/profiles", { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var names = (d && d.profiles) ? d.profiles : [];
        profileSelect.innerHTML = '<option value="">— saved profiles —</option>';
        names.forEach(function(name){
          var opt = document.createElement("option");
          opt.value = name; opt.textContent = name;
          profileSelect.appendChild(opt);
        });
      })
      .catch(function(){ /* device may not implement this endpoint yet */ });
  }
  refreshProfileList();

  document.getElementById("btnLoadProfile").addEventListener("click", function(){
    var name = profileSelect.value;
    if (!name) return;
    fetch("/profile/load?name=" + encodeURIComponent(name), { cache: "no-store" })
      .then(function(r){ return r.text(); })
      .then(function(text){
        profileText.value = text;
        drawProfileChart();
        fitStatus.textContent = "";
        fitStatus.className = "fit-status";
      })
      .catch(function(){ alert("Could not load profile from device."); });
  });

  document.getElementById("btnDeleteProfile").addEventListener("click", function(){
    var name = profileSelect.value;
    if (!name) return;
    if (!confirm('Delete profile "' + name + '" from device?')) return;
    fetch("/profile/delete?name=" + encodeURIComponent(name), { method: "POST" })
      .then(function(){ refreshProfileList(); })
      .catch(function(){ alert("Could not delete profile."); });
  });

  document.getElementById("btnSaveProfile").addEventListener("click", function(){
    var name = prompt("Save profile as:");
    if (!name) return;
    fitStatus.textContent = "FITTING…";
    fitStatus.className = "fit-status";
    fetch("/profile/save?name=" + encodeURIComponent(name), {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: profileText.value
    })
      .then(function(r){ return r.json(); })
      .then(function(resp){
        refreshProfileList();
        if (resp && resp.fitValid){
          fitStatus.textContent = "FIT OK";
          fitStatus.className = "fit-status ok";
        } else {
          fitStatus.textContent = "FIT FAILED";
          fitStatus.className = "fit-status bad";
        }
      })
      .catch(function(){
        alert("Could not save profile to device.");
        fitStatus.textContent = "";
        fitStatus.className = "fit-status";
      });
  });

  /* ---------------- Initial paint ---------------- */
  drawProfileChart();
  drawTempChart();

})();
</script>
</body>
